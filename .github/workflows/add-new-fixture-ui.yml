name: Add New Fixture UI Updater
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and UI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          s = app.read_text()
          marker = "@app.delete('/api/admin/delete/<int:i>')"
          if '/api/admin/new-fixture' not in s:
              block = '''@app.post('/api/admin/new-fixture')
@require_admin
def admin_new_fixture():
 d=request.get_json(silent=True) or {}
 sheet=str(d.get('sheet','')).strip();fixture_no=str(d.get('fixture_no','')).strip();item_no=str(d.get('item_no','')).strip()
 if sheet not in ('AFS','TOP HAT','UNISHELL') or not fixture_no or not item_no:return jsonify(error='Sheet, Fixture No and Item No are required'),400
 existing=get('fixtures',{'select':'id','sheet':f'eq.{sheet}','fixture_no':f'eq.{fixture_no}','limit':'1'})
 if existing:return jsonify(error='Fixture already exists. Use ADD ITEM for additional items.'),409
 try:bom=float(d.get('bom_qty') or 0);sets=float(d.get('no_of_sets') or 0);received=max(0,float(d.get('received') or 0))
 except Exception:return jsonify(error='Enter valid numeric quantities.'),400
 if bom<0 or sets<0:return jsonify(error='BOM Qty and No. of Sets cannot be negative.'),400
 x={'sheet':sheet,'fixture_no':fixture_no,'item_no':item_no,'description':d.get('description',''),'material':d.get('material',''),'bom_qty':bom,'no_of_sets':sets,'total_qty':bom*sets,'received':received,'status':d.get('status','')}
 row=insert('fixtures',x)
 return jsonify(ok=True,item=row[0] if row else x)
'''
              if marker not in s: raise SystemExit('app marker not found')
              s = s.replace(marker, block + marker, 1)
              app.write_text(s)

          p = Path('templates/index.html')
          s = p.read_text()
          old = '<button class="btn green" onclick="openAdd()">＋ ADD ITEM</button><button class="btn gray" onclick="openPasswordChange()">CHANGE PASSWORD</button>'
          new = '<button class="btn green" onclick="openAdd()">＋ ADD ITEM</button><button class="btn dark" onclick="openNewFixture()">＋ ADD NEW FIXTURE</button><button class="btn gray" onclick="openPasswordChange()">CHANGE PASSWORD</button>'
          if 'onclick="openNewFixture()"' not in s:
              if old not in s: raise SystemExit('admin controls marker not found')
              s = s.replace(old,new,1)
          modal_marker = '<div id="passwordModal" class="modal" style="display:none">'
          modal = '<div id="newFixtureModal" class="modal" style="display:none"><div class="modalbox"><h2>＋ Add New Fixture</h2><div class="small">Create the first BOM item for a new fixture. You can add more items after saving.</div><div class="addfields" style="margin-top:10px"><div><span class="label">SHEET</span><select id="newfsheet"><option>AFS</option><option>TOP HAT</option><option>UNISHELL</option></select></div><div><span class="label">FIXTURE NO.</span><input id="newffixture" placeholder="e.g. 1137"></div><div><span class="label">FIRST ITEM NO.</span><input id="newfitem" value="1"></div><div><span class="label">MATERIAL</span><input id="newfmaterial" placeholder="AL / MS / SS"></div><div class="full"><span class="label">DESCRIPTION</span><input id="newfdesc"></div><div><span class="label">BOM QTY</span><input id="newfbom" type="number" min="0"></div><div><span class="label">NO. OF SETS</span><input id="newfsets" type="number" min="0" value="1"></div><div><span class="label">RECEIVED</span><input id="newfrec" type="number" min="0" value="0"></div><div><span class="label">STATUS</span><input id="newfstatus"></div></div><div id="newfmsg" class="small" style="margin-top:8px"></div><div class="modalactions"><button class="btn gray" onclick="closeNewFixture()">CANCEL</button><button class="btn green" onclick="addNewFixture()">CREATE FIXTURE</button></div></div></div>'
          if 'id="newFixtureModal"' not in s:
              if modal_marker not in s: raise SystemExit('password modal marker not found')
              s = s.replace(modal_marker, modal + modal_marker, 1)
          js_marker = 'function openPasswordChange()'
          js = '''function openNewFixture(){let s=$('sheet').value;$('newfsheet').value=s;$('newffixture').value='';$('newfitem').value='1';$('newfmaterial').value='';$('newfdesc').value='';$('newfbom').value='';$('newfsets').value='1';$('newfrec').value='0';$('newfstatus').value='';$('newfmsg').textContent='';$('newFixtureModal').style.display='flex'}function closeNewFixture(){$('newFixtureModal').style.display='none'}async function addNewFixture(){let d={sheet:$('newfsheet').value,fixture_no:$('newffixture').value,item_no:$('newfitem').value,description:$('newfdesc').value,material:$('newfmaterial').value,bom_qty:$('newfbom').value,no_of_sets:$('newfsets').value,received:$('newfrec').value,status:$('newfstatus').value};if(!d.fixture_no.trim()||!d.item_no.trim()){ $('newfmsg').textContent='Fixture No. and Item No. are required.';return}let r=await fetch('/api/admin/new-fixture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let x=await r.json();$('newfmsg').textContent=r.ok?'Fixture created successfully.':(x.error||'Create failed');if(r.ok){closeNewFixture();$('sheet').value=d.sheet;$('fixture').value=d.fixture_no.trim();searchItems()}}'''
          if 'function openNewFixture()' not in s:
              if js_marker not in s: raise SystemExit('JS marker not found')
              s = s.replace(js_marker, js + js_marker, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html
          git diff --cached --quiet || git commit -m "Add admin option to create new fixture"
          git push
      - name: Remove temporary updater
        run: |
          git rm .github/workflows/add-new-fixture-ui.yml
          git commit -m "Remove temporary fixture UI updater"
          git push
