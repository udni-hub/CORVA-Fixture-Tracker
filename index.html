<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>CORVA Fixture Tracker</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#0f172a;font-family:Arial}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.head{background:#0f172a;color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0;color:#cbd5e1;font-size:12px}.main{padding:14px}.card,.item{border:1px solid #dbe2ea;border-radius:16px;padding:14px;margin-bottom:12px}.label{display:block;font-size:10px;font-weight:800;color:#64748b;margin-bottom:6px}select,input,button{width:100%;padding:13px;border-radius:11px;font-size:15px}select,input{border:1px solid #cbd5e1;background:#fff}.row{display:grid;grid-template-columns:1fr 100px;gap:8px}.btn{border:0;font-weight:800}.dark{background:#0f172a;color:#fff}.green{background:#0f766e;color:#fff}.red{background:#fee2e2;color:#991b1b}.gray{background:#e2e8f0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.itemhead{display:flex;justify-content:space-between}.ino{font-weight:800;font-size:17px}.desc{font-size:12px;color:#64748b;margin-top:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{background:#f8fafc;border-radius:9px;padding:9px 3px;text-align:center}.m b{display:block;font-size:9px;color:#64748b}.m span{font-size:16px;font-weight:800}.receive{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;margin-top:10px}.admin{background:#fff7ed;border-color:#fed7aa}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.small{font-size:10px;color:#64748b}.logout{float:right;width:auto;padding:7px 11px;background:#334155;color:#fff;border:0;border-radius:9px}.msg{margin:8px 0;padding:9px;border-radius:9px;background:#ecfdf5;color:#065f46;font-size:13px}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.receive{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 95px}}</style></head>
<body><div class=app><div class=head><button class=logout onclick=logout()>Logout</button><h1>CORVA Fixture Tracker</h1><p>{{username}} • {{role}}</p></div><div class=main>
<div class=card><span class=label>SHEET</span><select id=sheet><option>AFS</option><option>TOP HAT</option><option>UNISHELL</option></select><div style="margin-top:10px"><span class=label>FIXTURE NO.</span><div class=row><input id=fixture placeholder="e.g. 1084"><button class="btn dark" onclick=searchItems()>SEARCH</button></div></div><div class=tools><button class="btn gray" onclick=clearAll()>CLEAR</button><button class="btn green" onclick=exportExcel()>EXPORT EXCEL</button></div><div id=msg></div></div>
<div id=results></div></div></div>
<script>
const ADMIN={{'true' if role=='admin' else 'false'}};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}
function num(v){let n=Number(v||0);return Number.isInteger(n)?n:n.toFixed(2)}
async function searchItems(){let r=await fetch('/api/fixtures?sheet='+encodeURIComponent(sheet.value)+'&fixture='+encodeURIComponent(fixture.value.trim()));let x=await r.json();render(x.items||[])}
function render(items){results.innerHTML='';if(!items.length){results.innerHTML='<div class=card>No items found.</div>';return}
items.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class=itemhead><div><div class=ino>Item ${esc(x.item_no)}</div><div class=desc>${esc(x.description)}</div></div></div><div class=metrics><div class=m><b>TOTAL</b><span>${num(x.total_qty)}</span></div><div class=m><b>RECEIVED</b><span id=r${x.id}>${num(x.received)}</span></div><div class=m><b>BALANCE</b><span id=b${x.id}>${num(x.balance)}</span></div><div class=m><b>BUILDABLE</b><span id=f${x.id}>${num(x.buildable)}</span></div></div><div class=small style="margin-top:8px">BOM Qty: ${num(x.bom_qty)} • Sets: ${num(x.no_of_sets)}</div><div class=receive><input id=q${x.id} type=number min=0 step=1 placeholder="Qty"><button class="btn dark" onclick=change(${x.id},'add')>ADD</button><button class="btn red" onclick=change(${x.id},'remove')>REMOVE</button></div>`;results.appendChild(d);
if(ADMIN)d.insertAdjacentHTML('beforeend',`<div class="card admin"><b>ADMIN EDIT</b><div class=editgrid><label class=small>Description<input id=d${x.id} value="${esc(x.description)}"></label><label class=small>BOM Qty<input id=o${x.id} value="${x.bom_qty}"></label><label class=small>Sets<input id=s${x.id} value="${x.no_of_sets}"></label><label class=small>Total Qty<input id=t${x.id} value="${x.total_qty}"></label><label class=small>Received<input id=rr${x.id} value="${x.received}"></label><label class=small>Status<input id=st${x.id} value="${esc(x.status||'')}"></label></div><button class="btn dark" style="margin-top:8px" onclick=saveAdmin(${x.id})>SAVE CHANGES</button><button class="btn red" style="margin-top:7px" onclick=delItem(${x.id})>DELETE ITEM</button></div>`)});}
async function change(id,action){let q=Number(document.getElementById('q'+id).value);if(!q||q<=0){show('Enter quantity first.');return}let r=await fetch('/api/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,qty:q,action})});let x=await r.json();if(!r.ok){show(x.error);return}document.getElementById('r'+id).textContent=num(x.received);document.getElementById('b'+id).textContent=num(x.balance);document.getElementById('f'+id).textContent=num(x.buildable);document.getElementById('q'+id).value='';show('Updated successfully.')}
async function saveAdmin(id){let body={id,description:document.getElementById('d'+id).value,bom_qty:Number(document.getElementById('o'+id).value)||0,no_of_sets:Number(document.getElementById('s'+id).value)||0,total_qty:Number(document.getElementById('t'+id).value)||0,received:Number(document.getElementById('rr'+id).value)||0,status:document.getElementById('st'+id).value};let r=await fetch('/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)show(x.error);else{show('Admin changes saved.');searchItems()}}
async function delItem(id){if(!confirm('Delete this item?'))return;let r=await fetch('/api/admin/delete/'+id,{method:'DELETE'});if(r.ok)searchItems();else show((await r.json()).error)}
function clearAll(){fixture.value='';results.innerHTML='';msg.textContent=''}
function show(t){msg.textContent=t}
async function exportExcel(){window.location='/api/export'}
async function logout(){await fetch('/api/logout',{method:'POST'});location='/login'}
fixture.addEventListener('keydown',e=>{if(e.key==='Enter')searchItems()})
</script></body></html>
