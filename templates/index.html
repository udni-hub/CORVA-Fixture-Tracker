<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORVA Fixture Tracker</title><style>body{font-family:Arial;margin:0;background:#eef2f7;color:#0f172a}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}.head{background:#0f172a;color:white;padding:18px;position:relative}.head h1{margin:0;font-size:22px}.head p{margin:5px 0;color:#cbd5e1;font-size:12px}.adminbtn{position:absolute;right:14px;top:16px;width:auto;padding:9px 12px;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:10px;font-weight:bold}.main{padding:14px}.card,.item{border:1px solid #dbe2ea;border-radius:16px;padding:14px;margin-bottom:12px}.label{display:block;font-size:10px;font-weight:bold;color:#64748b;margin-bottom:6px}input,select,button{width:100%;padding:12px;border-radius:10px;font-size:15px;box-sizing:border-box}input,select{border:1px solid #cbd5e1;background:#fff}.row{display:grid;grid-template-columns:1fr 100px;gap:8px}.tools,.adminactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn{border:0;font-weight:bold}.dark{background:#0f172a;color:#fff}.green{background:#0f766e;color:#fff}.red{background:#fee2e2;color:#991b1b}.gray{background:#e2e8f0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{background:#f8fafc;border-radius:9px;padding:9px;text-align:center}.m b{display:block;font-size:9px;color:#64748b}.m span{font-size:16px;font-weight:bold}.receive{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;margin-top:10px}.small{font-size:10px;color:#64748b}.msg{margin-top:8px;font-size:13px}.adminbox{margin-top:12px;padding:10px;border:2px solid #cbd5e1;background:#f8fafc;border-radius:12px}.adminfields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{width:100%;max-width:380px;background:white;border-radius:18px;padding:18px;box-sizing:border-box}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.receive{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 95px}.adminfields{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="head"><h1>CORVA Fixture Tracker</h1><p>Cloud tracker • Ready for receiving</p><button id="adminBtn" class="adminbtn" onclick="openAdmin()">🔐 ADMIN</button></div><div class="main"><div class="card"><span class="label">SHEET</span><select id="sheet"><option>AFS</option><option>TOP HAT</option><option>UNISHELL</option></select><div style="margin-top:10px"><span class="label">FIXTURE NO.</span><div class="row"><input id="fixture" placeholder="e.g. 1084"><button class="btn dark" onclick="searchItems()">SEARCH</button></div></div><div class="tools"><button class="btn gray" onclick="clearAll()">CLEAR</button><button class="btn green" onclick="exportExcel()">EXPORT EXCEL</button></div><div id="msg" class="msg"></div></div><div id="results"></div></div></div><div id="modal" class="modal" style="display:none"><div class="modalbox"><h2>Admin Login 🔐</h2><input id="adminuser" placeholder="Admin User ID"><input id="adminpass" type="password" placeholder="Admin Password" style="margin-top:8px"><div id="loginmsg" class="small" style="margin-top:8px"></div><div class="modalactions"><button class="btn gray" onclick="closeAdmin()">CANCEL</button><button class="btn dark" onclick="adminLogin()">LOGIN</button></div></div></div><script>const ADMIN={{ 'true' if role == 'admin' else 'false' }};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){let n=Number(v||0);return Number.isInteger(n)?n:n.toFixed(2)}function show(t){$('msg').textContent=t}async function searchItems(){try{let r=await fetch('/api/fixtures?sheet='+encodeURIComponent($('sheet').value)+'&fixture='+encodeURIComponent($('fixture').value.trim()));let x=await r.json();if(!r.ok){show(x.error||'Could not load data');return}render(x.items||[])}catch(e){show('Could not connect to cloud database')}}function render(items){$('results').innerHTML='';if(!items.length){$('results').innerHTML='<div class="card">No items found.</div>';return}items.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>Item '+esc(x.item_no)+'</b><div class="small">'+esc(x.description)+'</div><div class="metrics"><div class="m"><b>TOTAL</b><span>'+num(x.total_qty)+'</span></div><div class="m"><b>RECEIVED</b><span id="r'+x.id+'">'+num(x.received)+'</span></div><div class="m"><b>BALANCE</b><span id="b'+x.id+'">'+num(x.balance)+'</span></div><div class="m"><b>BUILDABLE</b><span id="f'+x.id+'">'+num(x.buildable)+'</span></div></div><div class="small" style="margin-top:8px">BOM Qty: '+num(x.bom_qty)+' • Sets: '+num(x.no_of_sets)+' • Status: '+esc(x.status)+'</div><div class="receive"><input id="q'+x.id+'" type="number" min="0" step="1" placeholder="Qty"><button class="btn dark" onclick="change('+x.id+',\'add\')">ADD</button><button class="btn red" onclick="change('+x.id+',\'remove\')">REMOVE</button></div>'+(ADMIN?'<div class="adminbox"><span class="label">ADMIN EDIT</span><div class="adminfields"><input id="efix'+x.id+'" value="'+esc(x.fixture_no)+'" placeholder="Fixture No"><input id="eitem'+x.id+'" value="'+esc(x.item_no)+'" placeholder="Item No"><input id="edesc'+x.id+'" value="'+esc(x.description)+'" placeholder="Description"><input id="ebom'+x.id+'" value="'+num(x.bom_qty)+'" type="number" placeholder="BOM Qty"><input id="esets'+x.id+'" value="'+num(x.no_of_sets)+'" type="number" placeholder="No. of Sets"><input id="etotal'+x.id+'" value="'+num(x.total_qty)+'" type="number" placeholder="Total Qty"><input id="erec'+x.id+'" value="'+num(x.received)+'" type="number" placeholder="Received"><input id="estatus'+x.id+'" value="'+esc(x.status)+'" placeholder="Status"></div><div class="adminactions"><button class="btn green" onclick="saveAdmin('+x.id+')">SAVE</button><button class="btn red" onclick="deleteAdmin('+x.id+')">DELETE</button></div></div>':'');$('results').appendChild(d)})}async function change(id,action){let q=Number($('q'+id).value);if(q<=0){show('Enter quantity first.');return}try{let r=await fetch('/api/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,qty:q,action:action})});let x=await r.json();if(!r.ok){show(x.error||'Update failed');return}$('r'+id).textContent=num(x.received);$('b'+id).textContent=num(x.balance);document.querySelectorAll('[id^="f"]').forEach(e=>e.textContent=num(x.buildable));$('q'+id).value='';show('Updated successfully.')}catch(e){show('Could not update cloud data')}}async function saveAdmin(id){let data={id:id,fixture_no:$('efix'+id).value,item_no:$('eitem'+id).value,description:$('edesc'+id).value,bom_qty:$('ebom'+id).value,no_of_sets:$('esets'+id).value,total_qty:$('etotal'+id).value,received:$('erec'+id).value,status:$('estatus'+id).value};let r=await fetch('/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();show(r.ok?'Admin update saved.':(x.error||'Admin update failed'));if(r.ok)searchItems()}async function deleteAdmin(id){if(!confirm('Delete this item?'))return;let r=await fetch('/api/admin/delete/'+id,{method:'DELETE'});let x=await r.json();show(r.ok?'Item deleted.':(x.error||'Delete failed'));if(r.ok)searchItems()}function openAdmin(){if(ADMIN)return;$('modal').style.display='flex';$('adminuser').focus()}function closeAdmin(){$('modal').style.display='none';$('loginmsg').textContent=''}async function adminLogin(){let u=$('adminuser').value.trim(),p=$('adminpass').value;if(!u||!p){$('loginmsg').textContent='Enter Admin ID and password.';return}try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let x=await r.json();if(!r.ok){$('loginmsg').textContent=x.error||'Invalid login';return}location.reload()}catch(e){$('loginmsg').textContent='Could not connect to server.'}}async function logoutAdmin(){await fetch('/api/logout',{method:'POST'});location.reload()}function clearAll(){$('fixture').value='';$('results').innerHTML='';show('')}function exportExcel(){window.location='/api/export'}$('fixture').addEventListener('keydown',e=>{if(e.key==='Enter')searchItems()});if(ADMIN){$('adminBtn').textContent='↪ LOGOUT ADMIN';$('adminBtn').onclick=logoutAdmin}</script></body></html>
