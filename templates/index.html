<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>CORVA Fixture Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#0f172a;font-family:Arial}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.head{background:#0f172a;color:#fff;padding:18px 16px;border-radius:0 0 22px 22px;position:relative}.head h1{margin:0;font-size:22px}.head p{margin:5px 0;color:#cbd5e1;font-size:12px}.adminbtn{position:absolute;right:14px;top:18px;width:auto;padding:9px 12px;border:1px solid #475569;background:#1e293b;color:#fff;border-radius:10px;font-weight:800}.main{padding:14px}.card,.item{border:1px solid #dbe2ea;border-radius:16px;padding:14px;margin-bottom:12px}.label{display:block;font-size:10px;font-weight:800;color:#64748b;margin-bottom:6px}select,input,button{width:100%;padding:13px;border-radius:11px;font-size:15px}select,input{border:1px solid #cbd5e1;background:#fff}.row{display:grid;grid-template-columns:1fr 100px;gap:8px}.btn{border:0;font-weight:800}.dark{background:#0f172a;color:#fff}.green{background:#0f766e;color:#fff}.red{background:#fee2e2;color:#991b1b}.gray{background:#e2e8f0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.itemhead{display:flex;justify-content:space-between}.ino{font-weight:800;font-size:17px}.desc{font-size:12px;color:#64748b;margin-top:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{background:#f8fafc;border-radius:9px;padding:9px 3px;text-align:center}.m b{display:block;font-size:9px;color:#64748b}.m span{font-size:16px;font-weight:800}.receive{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;margin-top:10px}.small{font-size:10px;color:#64748b}.msg{margin:8px 0;padding:9px;border-radius:9px;background:#ecfdf5;color:#065f46;font-size:13px}.adminbox{border:2px solid #cbd5e1;background:#f8fafc}.adminfields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.adminfields input{padding:10px;font-size:13px}.adminactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:18px}.modalbox h2{margin:0 0 12px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.receive{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 95px}.adminfields{grid-template-columns:1fr}}
</style></head><body><div class=app><div class=head><h1>CORVA Fixture Tracker</h1><p>Cloud tracker • Ready for receiving</p><button class=adminbtn onclick="openAdmin()">🔐 ADMIN</button></div><div class=main><div class=card><span class=label>SHEET</span><select id=sheet><option>AFS</option><option>TOP HAT</option><option>UNISHELL</option></select><div style="margin-top:10px"><span class=label>FIXTURE NO.</span><div class=row><input id=fixture placeholder="e.g. 1084"><button class="btn dark" onclick=searchItems()>SEARCH</button></div></div><div class=tools><button class="btn gray" onclick=clearAll()>CLEAR</button><button class="btn green" onclick=exportExcel()>EXPORT EXCEL</button></div><div id=msg></div></div><div id=results></div></div></div><div id=modal style="display:none" class=modal><div class=modalbox><h2>Admin Login 🔐</h2><input id=adminuser placeholder="Admin User ID"><input id=adminpass type=password placeholder="Admin Password" style="margin-top:8px"><div id=loginmsg class=small style="margin-top:8px"></div><div class=modalactions><button class="btn gray" onclick=closeAdmin()>CANCEL</button><button class="btn dark" onclick=adminLogin()>LOGIN</button></div></div></div><script>
const ADMIN=__ADMIN__;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){let n=Number(v||0);return Number.isInteger(n)?n:n.toFixed(2)}
async function searchItems(){try{let r=await fetch('/api/fixtures?sheet='+encodeURIComponent(sheet.value)+'&fixture='+encodeURIComponent(fixture.value.trim()));let x=await r.json();if(!r.ok){show(x.error||'Could not load data.');return}render(x.items||[])}catch(e){show('Could not connect to cloud database.')}}
function render(items){results.innerHTML='';if(!items.length){results.innerHTML='<div class=card>No items found.</div>';return}items.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class=itemhead><div><div class=ino>Item ${esc(x.item_no)}</div><div class=desc>${esc(x.description)}</div></div></div><div class=metrics><div class=m><b>TOTAL</b><span>${num(x.total_qty)}</span></div><div class=m><b>RECEIVED</b><span id=r${x.id}>${num(x.received)}</span></div><div class=m><b>BALANCE</b><span id=b${x.id}>${num(x.balance)}</span></div><div class=m><b>BUILDABLE</b><span id=f${x.id}>${num(x.buildable)}</span></div></div><div class=small style="margin-top:8px">BOM Qty: ${num(x.bom_qty)} • Sets: ${num(x.no_of_sets)} • Status: ${esc(x.status)}</div><div class=receive><input id=q${x.id} type=number min=0 step=1 placeholder="Qty"><button class="btn dark" onclick=change(${x.id},'add')>ADD</button><button class="btn red" onclick=change(${x.id},'remove')>REMOVE</button></div>${ADMIN?`<div class="adminbox" style="margin-top:12px;padding:10px"><span class=label>ADMIN EDIT</span><div class=adminfields><input id=efix${x.id} value="${esc(x.fixture_no)}" placeholder="Fixture No"><input id=eitem${x.id} value="${esc(x.item_no)}" placeholder="Item No"><input id=edesc${x.id} value="${esc(x.description)}" placeholder="Description"><input id=ebom${x.id} value="${num(x.bom_qty)}" type=number placeholder="BOM Qty"><input id=esets${x.id} value="${num(x.no_of_sets)}" type=number placeholder="No. of Sets"><input id=etotal${x.id} value="${num(x.total_qty)}" type=number placeholder="Total Qty"><input id=erec${x.id} value="${num(x.received)}" type=number placeholder="Received"><input id=estatus${x.id} value="${esc(x.status)}" placeholder="Status"></div><div class=adminactions><button class="btn green" onclick=saveAdmin(${x.id})>SAVE</button><button class="btn red" onclick=deleteAdmin(${x.id})>DELETE</button></div></div>`:''}`;results.appendChild(d)})}
async function change(id,action){let q=Number(document.getElementById('q'+id).value);if(!q||q<=0){show('Enter quantity first.');return}try{let r=await fetch('/api/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,qty:q,action})});let x=await r.json();if(!r.ok){show(x.error||'Update failed');return}document.getElementById('r'+id).textContent=num(x.received);document.getElementById('b'+id).textContent=num(x.balance);document.querySelectorAll('[id^="f"]').forEach(el=>el.textContent=num(x.buildable));document.getElementById('q'+id).value='';show('Updated successfully.')}catch(e){show('Could not update cloud data.')}}
async function saveAdmin(id){let data={id,fixture_no:document.getElementById('efix'+id).value,item_no:document.getElementById('eitem'+id).value,description:document.getElementById('edesc'+id).value,bom_qty:document.getElementById('ebom'+id).value,no_of_sets:document.getElementById('esets'+id).value,total_qty:document.getElementById('etotal'+id).value,received:document.getElementById('erec'+id).value,status:document.getElementById('estatus'+id).value};let r=await fetch('/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();show(r.ok?'Admin update saved.':(x.error||'Admin update failed.'));if(r.ok)searchItems()}
async function deleteAdmin(id){if(!confirm('Delete this item?'))return;let r=await fetch('/api/admin/delete/'+id,{method:'DELETE'});let x=await r.json();show(r.ok?'Item deleted.':(x.error||'Delete failed.'));if(r.ok)searchItems()}
function openAdmin(){if(ADMIN){alert('Admin mode is already active.');return}modal.style.display='flex';adminuser.focus()}function closeAdmin(){modal.style.display='none';loginmsg.textContent=''}
async function adminLogin(){let u=adminuser.value.trim(),p=adminpass.value;if(!u||!p){loginmsg.textContent='Enter Admin ID and password.';return}let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let x=await r.json();if(!r.ok){loginmsg.textContent=x.error||'Invalid login';return}location.reload()}
async function logoutAdmin(){await fetch('/api/logout',{method:'POST'});location.reload()}
function clearAll(){fixture.value='';results.innerHTML='';msg.textContent=''}function show(t){msg.textContent=t}function exportExcel(){window.location='/api/export'}fixture.addEventListener('keydown',e=>{if(e.key==='Enter')searchItems()});if(ADMIN){document.querySelector('.adminbtn').textContent='↪ LOGOUT ADMIN';document.querySelector('.adminbtn').onclick=logoutAdmin}
</script></body></html>
