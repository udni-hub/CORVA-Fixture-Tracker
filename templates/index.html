<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORVA Fixture Tracker</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef2f7;color:#0f172a}.app{max-width:860px;margin:auto;background:#fff;min-height:100vh}.head{background:#0f172a;color:#fff;padding:16px 18px;position:relative}.head h1{margin:0 0 4px 48px;font-size:21px}.head p{margin:0 0 0 48px;color:#cbd5e1;font-size:11px}.menuBtn{position:absolute;left:12px;top:14px;width:38px;padding:8px;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:9px;font-size:20px}.main{padding:14px}.card,.item,.adminbox{border:1px solid #dbe2ea;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}.label{display:block;font-size:10px;font-weight:bold;color:#64748b;margin-bottom:6px}input,select,button{width:100%;padding:12px;border-radius:10px;font-size:14px}input,select{border:1px solid #cbd5e1;background:#fff}.row{display:grid;grid-template-columns:1fr 105px;gap:8px}.tools,.adminactions,.addactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn{border:0;font-weight:bold;cursor:pointer}.dark{background:#0f172a;color:#fff}.green{background:#0f766e;color:#fff}.red{background:#fee2e2;color:#991b1b}.gray{background:#e2e8f0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.m{background:#f8fafc;border-radius:9px;padding:9px;text-align:center}.m b{display:block;font-size:9px;color:#64748b}.m span{font-size:16px;font-weight:bold}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.metaBox{padding:8px;background:#f8fafc;border-radius:8px;font-size:11px}.metaBox b{display:block;font-size:9px;color:#64748b;margin-bottom:3px}.receive{display:grid;grid-template-columns:1fr 80px 80px;gap:6px;margin-top:10px}.small{font-size:11px;color:#64748b}.msg{margin-top:8px;font-size:13px}.adminbox{margin-top:18px;border:2px solid #cbd5e1;background:#f8fafc}.adminTitle{font-size:14px;font-weight:bold;color:#475569;margin-bottom:12px}.adminfields,.addfields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.adminfield label{display:block;font-size:10px;font-weight:bold;color:#64748b;margin:2px 0 5px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbox{width:100%;max-width:440px;background:white;border-radius:18px;padding:18px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.passrow{display:grid;grid-template-columns:1fr 85px;gap:7px;margin-top:8px}.linkbtn{background:none;border:0;color:#0f766e;text-align:left;padding:10px 0;font-size:13px;font-weight:bold}.drawer{position:fixed;inset:0;background:#0006;z-index:15;display:none}.drawerBox{width:300px;max-width:84%;height:100%;background:#fff;padding:20px;overflow:auto}.drawerBox h2{margin-top:0}.menuItem{margin:8px 0;padding:13px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;font-weight:bold;cursor:pointer}.fixtureList{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.fixtureCard{border:1px solid #dbe2ea;background:#f8fafc;border-radius:12px;padding:13px;text-align:center;font-weight:bold;cursor:pointer}.sectionTitle{font-size:13px;font-weight:bold;margin:14px 0 8px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#e2e8f0;font-size:10px;font-weight:bold;color:#475569}.userbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.userbar button{width:auto;padding:8px 11px;font-size:11px}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}.receive{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 95px}.adminfields,.addfields{grid-template-columns:1fr}.full{grid-column:auto}.fixtureList{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><div class="head"><button class="menuBtn" onclick="openMenu()">☰</button><h1>CORVA Fixture Tracker</h1><p>Cloud tracker • BOM & receiving control</p></div><div class="main">
<div class="card"><span class="label">SHEET</span><select id="sheet"><option>AFS</option><option>TOP HAT</option><option>UNISHELL</option></select><div style="margin-top:10px"><span class="label">FIXTURE NO.</span><div class="row"><input id="fixture" placeholder="e.g. 1093"><button class="btn dark" onclick="searchItems()">SEARCH</button></div></div><div class="tools"><button class="btn gray" onclick="clearAll()">CLEAR</button><button class="btn green" onclick="exportExcel()">EXPORT EXCEL</button></div><div id="msg" class="msg"></div></div><div id="results"></div></div></div>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeMenu()"><div class="drawerBox"><h2>☰ Menu</h2><div class="small">SELECT FIXTURE</div><div class="menuItem" onclick="showFixtureMenu('AFS')">AFS ›</div><div class="menuItem" onclick="showFixtureMenu('TOP HAT')">TOP HAT ›</div><div class="menuItem" onclick="showFixtureMenu('UNISHELL')">UNISHELL ›</div><div class="menuItem" onclick="openAdmin()">🔐 ADMIN LOGIN</div><div id="drawerContent"></div></div></div>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><h2>Admin Login 🔐</h2><input id="adminuser" placeholder="Admin User ID"><div class="passrow"><input id="adminpass" type="password" placeholder="Admin Password"><button class="btn gray" onclick="togglePass('adminpass',this)">👁 SHOW</button></div><button class="linkbtn" onclick="openForgot()">Forgot Password?</button><div id="loginmsg" class="small"></div><div class="modalactions"><button class="btn gray" onclick="closeAdmin()">CANCEL</button><button class="btn dark" onclick="adminLogin()">LOGIN</button></div></div></div>
<div id="forgot" class="modal" style="display:none"><div class="modalbox"><h2>Reset Admin Password 🔑</h2><div class="small">OTP will be sent to the registered admin email.</div><input id="recoveryuser" placeholder="Admin User ID" style="margin-top:10px"><input id="recoveryemail" type="email" placeholder="Registered Email" style="margin-top:8px"><button class="btn dark" style="margin-top:8px" onclick="sendOtp()">SEND OTP</button><input id="otp" placeholder="6-digit OTP" inputmode="numeric" maxlength="6" style="margin-top:8px"><div class="passrow"><input id="newpass" type="password" placeholder="New Password (8+ chars)"><button class="btn gray" onclick="togglePass('newpass',this)">👁 SHOW</button></div><div class="passrow"><input id="confirmpass" type="password" placeholder="Confirm New Password"><button class="btn gray" onclick="togglePass('confirmpass',this)">👁 SHOW</button></div><button class="linkbtn" onclick="sendOtp()">↻ Send New OTP</button><div id="forgotmsg" class="small"></div><div class="modalactions"><button class="btn gray" onclick="closeForgot()">CANCEL</button><button class="btn dark" onclick="resetPassword()">RESET PASSWORD</button></div></div></div>
<script>
const ADMIN={{ 'true' if role == 'admin' else 'false' }};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){let n=Number(v||0);return Number.isInteger(n)?n:n.toFixed(2)}function show(t){$('msg').textContent=t}function togglePass(id,b){let e=$(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'👁 SHOW':'🙈 HIDE'}function openMenu(){$('drawer').style.display='block'}function closeMenu(){$('drawer').style.display='none'}
async function showFixtureMenu(sheet){$('drawerContent').innerHTML='<div class="small" style="margin-top:14px">'+sheet+' FIXTURE NUMBERS</div><div class="fixtureList" id="fixtureList">Loading...</div>';try{let r=await fetch('/api/fixture-numbers?sheet='+encodeURIComponent(sheet));let x=await r.json();let box=$('fixtureList');box.innerHTML='';(x.fixtures||[]).forEach(f=>{let b=document.createElement('div');b.className='fixtureCard';b.textContent=f;b.onclick=()=>{closeMenu();$('sheet').value=sheet;$('fixture').value=f;searchItems()};box.appendChild(b)});if(!box.children.length)box.innerHTML='<div class="small">No fixtures found.</div>'}catch(e){$('fixtureList').textContent='Could not load fixtures.'}}
async function searchItems(){try{let r=await fetch('/api/fixtures?sheet='+encodeURIComponent($('sheet').value)+'&fixture='+encodeURIComponent($('fixture').value.trim()));let x=await r.json();if(!r.ok){show(x.error||'Could not load data');return}render(x.items||[])}catch(e){show('Could not connect to cloud database')}}
function render(items){$('results').innerHTML='';if(!items.length){$('results').innerHTML='<div class="card">No items found.</div>';return}let head=document.createElement('div');head.className='card';head.innerHTML='<div class="userbar"><div><b>'+esc($('sheet').value)+' • Fixture '+esc(items[0].fixture_no)+'</b><div class="small">Only configured BOM items are shown.</div></div><span class="badge">'+items.length+' ITEMS</span></div>';if(ADMIN)head.innerHTML+='<div class="sectionTitle">ADMIN CONTROLS</div><div class="addactions"><button class="btn green" onclick="openAdd()">＋ ADD ITEM</button><button class="btn gray" onclick="openPasswordChange()">CHANGE PASSWORD</button></div><button class="btn red" style="margin-top:8px" onclick="logout()">LOGOUT ADMIN</button>';$('results').appendChild(head);items.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><div><b>Item '+esc(x.item_no)+'</b><div class="small">'+esc(x.description)+'</div></div><span class="badge">'+esc(x.material||'Material —')+'</span></div><div class="metrics"><div class="m"><b>TOTAL</b><span>'+num(x.total_qty)+'</span></div><div class="m"><b>RECEIVED</b><span id="r'+x.id+'">'+num(x.received)+'</span></div><div class="m"><b>BALANCE</b><span id="b'+x.id+'">'+num(x.balance)+'</span></div><div class="m"><b>BUILDABLE</b><span id="f'+x.id+'">'+num(x.buildable)+'</span></div></div><div class="meta"><div class="metaBox"><b>BOM QTY</b>'+num(x.bom_qty)+'</div><div class="metaBox"><b>SETS</b>'+num(x.no_of_sets)+'</div><div class="metaBox"><b>MATERIAL</b>'+esc(x.material||'—')+'</div><div class="metaBox"><b>STATUS</b>'+esc(x.status||'—')+'</div></div><div class="receive"><input id="q'+x.id+'" type="number" min="0" step="1" placeholder="Qty"><button class="btn dark" onclick="change('+x.id+',\'add\')">ADD</button><button class="btn red" onclick="change('+x.id+',\'remove\')">REMOVE</button></div>'+(ADMIN?'<div class="adminbox"><div class="adminTitle">ADMIN EDIT — Item '+esc(x.item_no)+'</div><div class="adminfields"><div class="adminfield"><label>Fixture No.</label><input id="efix'+x.id+'" value="'+esc(x.fixture_no)+'"></div><div class="adminfield"><label>Item No.</label><input id="eitem'+x.id+'" value="'+esc(x.item_no)+'"></div><div class="adminfield full"><label>Description</label><input id="edesc'+x.id+'" value="'+esc(x.description)+'"></div><div class="adminfield"><label>Material</label><input id="emat'+x.id+'" value="'+esc(x.material||'')+'" placeholder="AL / MS / SS / SS-MS"></div><div class="adminfield"><label>BOM Qty</label><input id="ebom'+x.id+'" value="'+num(x.bom_qty)+'" type="number"></div><div class="adminfield"><label>No. of Sets</label><input id="esets'+x.id+'" value="'+num(x.no_of_sets)+'" type="number"></div><div class="adminfield"><label>Total Qty</label><input id="etotal'+x.id+'" value="'+num(x.total_qty)+'" type="number"></div><div class="adminfield"><label>Received Qty</label><input id="erec'+x.id+'" value="'+num(x.received)+'" type="number"></div><div class="adminfield full"><label>Status</label><input id="estatus'+x.id+'" value="'+esc(x.status||'')+'" placeholder="Enter status"></div></div><div class="adminactions"><button class="btn green" onclick="saveAdmin('+x.id+')">SAVE</button><button class="btn red" onclick="deleteAdmin('+x.id+')">DELETE</button></div></div>':'');$('results').appendChild(d)})}
async function change(id,action){let q=Number($('q'+id).value);if(q<=0){show('Enter quantity first.');return}try{let r=await fetch('/api/receive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,qty:q,action:action})});let x=await r.json();if(!r.ok){show(x.error||'Update failed');return}$('r'+id).textContent=num(x.received);$('b'+id).textContent=num(x.balance);document.querySelectorAll('[id^="f"]').forEach(e=>e.textContent=num(x.buildable));$('q'+id).value='';show('Updated successfully.')}catch(e){show('Could not update cloud data')}}
async function saveAdmin(id){let data={id:id,fixture_no:$('efix'+id).value,item_no:$('eitem'+id).value,description:$('edesc'+id).value,material:$('emat'+id).value,bom_qty:$('ebom'+id).value,no_of_sets:$('esets'+id).value,total_qty:$('etotal'+id).value,received:$('erec'+id).value,status:$('estatus'+id).value};let r=await fetch('/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();show(r.ok?'Admin update saved.':(x.error||'Admin update failed'));if(r.ok)searchItems()}
async function deleteAdmin(id){if(!confirm('Delete this item?'))return;let r=await fetch('/api/admin/delete/'+id,{method:'DELETE'});let x=await r.json();show(r.ok?'Item deleted.':(x.error||'Delete failed'));if(r.ok)searchItems()}
function openAdd(){let m=document.createElement('div');m.id='addModal';m.className='modal';m.innerHTML='<div class="modalbox"><h2>Add BOM Item</h2><div class="addfields"><input id="aSheet" value="'+esc($('sheet').value)+'" placeholder="Sheet"><input id="aFixture" value="'+esc($('fixture').value.trim())+'" placeholder="Fixture No."><input id="aItem" placeholder="Item No."><input id="aMaterial" placeholder="Material"><input id="aDesc" class="full" placeholder="Description"><input id="aBom" type="number" placeholder="BOM Qty"><input id="aSets" type="number" value="17" placeholder="Sets"><input id="aReceived" type="number" value="0" placeholder="Received"><input id="aStatus" class="full" placeholder="Status"></div><div class="modalactions"><button class="btn gray" onclick="closeAdd()">CANCEL</button><button class="btn green" onclick="addItem()">ADD ITEM</button></div></div>';document.body.appendChild(m)}function closeAdd(){$('addModal')?.remove()}
async function addItem(){let d={sheet:$('aSheet').value,fixture_no:$('aFixture').value,item_no:$('aItem').value,material:$('aMaterial').value,description:$('aDesc').value,bom_qty:$('aBom').value,no_of_sets:$('aSets').value,received:$('aReceived').value,status:$('aStatus').value};let r=await fetch('/api/admin/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let x=await r.json();if(!r.ok){alert(x.error||'Add failed');return}closeAdd();show('Item added.');searchItems()}
function openPasswordChange(){let m=document.createElement('div');m.id='pwModal';m.className='modal';m.innerHTML='<div class="modalbox"><h2>Change Admin Password</h2><input id="oldpw" type="password" placeholder="Current Password"><input id="newpw" type="password" placeholder="New Password (8+ chars)" style="margin-top:8px"><input id="newpw2" type="password" placeholder="Confirm New Password" style="margin-top:8px"><div id="pwmsg" class="small" style="margin-top:8px"></div><div class="modalactions"><button class="btn gray" onclick="closePw()">CANCEL</button><button class="btn dark" onclick="changePw()">SAVE</button></div></div>';document.body.appendChild(m)}function closePw(){$('pwModal')?.remove()}async function changePw(){let old=$('oldpw').value,n=$('newpw').value,c=$('newpw2').value;if(n!==c||n.length<8){$('pwmsg').textContent='New passwords must match and be 8+ characters.';return}let r=await fetch('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:old,new_password:n})});let x=await r.json();$('pwmsg').textContent=x.message||x.error;if(r.ok)setTimeout(closePw,700)}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
function openAdmin(){if(ADMIN){show('Already in admin mode.');closeMenu();return}$('modal').style.display='flex';closeMenu();$('adminuser').focus()}function closeAdmin(){$('modal').style.display='none';$('loginmsg').textContent=''}async function adminLogin(){let u=$('adminuser').value.trim(),p=$('adminpass').value;if(!u||!p){$('loginmsg').textContent='Enter Admin ID and password.';return}let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});let x=await r.json();if(!r.ok){$('loginmsg').textContent=x.error||'Login failed';return}location.reload()}function openForgot(){$('modal').style.display='none';$('forgot').style.display='flex';$('recoveryuser').value=$('adminuser').value;setTimeout(()=>$('recoveryuser').focus(),50)}function closeForgot(){$('forgot').style.display='none'}
async function sendOtp(){let u=$('recoveryuser').value.trim(),email=$('recoveryemail').value.trim();if(!u||!email){$('forgotmsg').textContent='Enter Admin ID and registered email.';return}try{let r=await fetch('/api/forgot/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:email})});let x=await r.json();$('forgotmsg').textContent=x.message||x.error||'Done'}catch(e){$('forgotmsg').textContent='Could not connect to server.'}}
async function resetPassword(){let u=$('recoveryuser').value.trim(),email=$('recoveryemail').value.trim(),otp=$('otp').value.trim(),p=$('newpass').value,cp=$('confirmpass').value;if(!u||!email||!otp||!p||!cp){$('forgotmsg').textContent='Fill all fields.';return}if(p!==cp){$('forgotmsg').textContent='Passwords do not match.';return}if(p.length<8){$('forgotmsg').textContent='New password must be at least 8 characters.';return}let r=await fetch('/api/forgot/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:email,otp:otp,new_password:p})});let x=await r.json();$('forgotmsg').textContent=x.message||x.error||'Done';if(r.ok)setTimeout(closeForgot,900)}
function clearAll(){$('fixture').value='';$('results').innerHTML='';show('Cleared.')}function exportExcel(){window.location='/api/export'}
</script></body></html>
