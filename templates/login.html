<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CORVA Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef2f7;font-family:Arial;color:#0f172a}
    .box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 8px 30px #0001}
    h1{margin:0 0 6px}
    p{color:#64748b;font-size:13px}
    input,button{width:100%;padding:14px;margin-top:10px;border-radius:12px;font-size:16px}
    input{border:1px solid #cbd5e1;background:#fff}
    button{border:0;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6}
    .err{color:#b91c1c;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>CORVA Tracker</h1>
    <p>Fixture Receiving Cloud App</p>
    <input id="u" placeholder="Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="login()">LOGIN</button>
    <div id="e" class="err"></div>
  </div>

  <script>
    async function login(){
      const btn=document.getElementById('loginBtn');
      const err=document.getElementById('e');
      const username=document.getElementById('u').value.trim();
      const password=document.getElementById('p').value;
      err.textContent='';
      if(!username||!password){err.textContent='Enter username and password.';return}
      btn.disabled=true;
      try{
        const r=await fetch('/api/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body:JSON.stringify({username,password})
        });
        const x=await r.json();
        if(x.ok){location.replace('/');}
        else{err.textContent=x.error||'Login failed';}
      }catch(ex){err.textContent='Server connection failed. Please try again.';}
      finally{btn.disabled=false;}
    }

    document.getElementById('p').addEventListener('keydown',e=>{
      if(e.key==='Enter') login();
    });
  </script>
</body>
</html>
