<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CORVA Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef2f7;font-family:Arial;color:#0f172a}
    .box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 8px 30px #0001}
    h1{margin:0 0 6px}
    p{color:#64748b;font-size:13px}
    input,button{width:100%;padding:14px;margin-top:10px;border-radius:12px;font-size:16px}
    input{border:1px solid #cbd5e1;background:#fff}
    button{border:0;background:#0f172a;color:#fff;font-weight:800;cursor:pointer}
    .admin{background:#64748b}
    .err{color:#b91c1c;font-size:13px;margin-top:10px}
    #adminBox{display:none}
  </style>
</head>
<body>
  <div class="box">
    <h1>CORVA Tracker</h1>
    <p>Fixture Receiving Cloud App</p>

    <button id="loginBtn" onclick="userLogin()">LOGIN</button>
    <button class="admin" onclick="showAdmin()">ADMIN LOGIN</button>

    <div id="adminBox">
      <input id="u" placeholder="Admin Username" autocomplete="username">
      <input id="p" type="password" placeholder="Admin Password" autocomplete="current-password">
      <button onclick="adminLogin()">ADMIN LOGIN</button>
    </div>
    <div id="e" class="err"></div>
  </div>

  <script>
    async function sendLogin(username,password){
      const err=document.getElementById('e');
      err.textContent='';
      try{
        const r=await fetch('/api/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body:JSON.stringify({username,password})
        });
        const x=await r.json();
        if(x.ok){location.replace('/');}
        else{err.textContent=x.error||'Login failed';}
      }catch(ex){err.textContent='Server connection failed. Please try again.';}
    }

    function userLogin(){
      sendLogin('MTAR','');
    }

    function showAdmin(){
      document.getElementById('adminBox').style.display='block';
      document.getElementById('u').focus();
    }

    function adminLogin(){
      const u=document.getElementById('u').value.trim();
      const p=document.getElementById('p').value;
      if(!u||!p){document.getElementById('e').textContent='Enter admin username and password.';return;}
      sendLogin(u,p);
    }
  </script>
</body>
</html>
