<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORVA Login</title>
<style>body{margin:0;background:#eef2f7;font-family:Arial;color:#0f172a}.box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 8px 30px #0001}h1{margin:0 0 6px}p{color:#64748b;font-size:13px}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:12px;font-size:16px}input{border:1px solid #cbd5e1}button{border:0;background:#0f172a;color:#fff;font-weight:800}.err{color:#b91c1c;font-size:13px;margin-top:10px}</style></head>
<body><div class=box><h1>CORVA Tracker</h1><p>Fixture Receiving Cloud App</p><input id=u placeholder=Username><input id=p type=password placeholder=Password><button onclick=login()>LOGIN</button><div id=e class=err></div></div>
<script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let x=await r.json();if(x.ok)location='/';else e.textContent=x.error||'Login failed'}</script></body></html>
